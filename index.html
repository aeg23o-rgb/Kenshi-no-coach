<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小4算数伴走コーチ (v11.12)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 10px;
        }
        /* 全体レイアウト：左右2カラム構成 */
        .main-container {
            display: flex;
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            height: 95vh;
        }
        .left-panel {
            flex: 1.2;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .right-panel {
            flex: 0.8;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        
        /* テーマ・メッセージエリア */
        .theme-badge {
            background: #2e7d32;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            align-self: flex-start;
        }
        .teacher-box {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #262626;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
        }
        .teacher-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #388e3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
            overflow: hidden;
        }
        .teacher-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .teacher-message {
            font-size: 14px;
            line-height: 1.5;
            flex: 1;
        }

        /* 手書きキャンバスエリア */
        .canvas-container {
            position: relative;
            background: #000;
            border: 2px solid #555;
            border-radius: 6px;
            height: 180px;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 操作ボタン群 */
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-voice { background: #2e7d32; color: white; flex: 1; }
        .btn-voice:hover { background: #388e3c; }
        .btn-submit { background: #1565c0; color: white; flex: 1; }
        .btn-submit:hover { background: #1976d2; }

        /* 右側：対話ログエリア */
        .log-header {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .log-content {
            flex: 1;
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
            color: #888;
        }

        /* ステータス・エラー表示用 */
        .status-bar {
            font-size: 12px;
            color: #ffb74d;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 左側：コーチング・入力エリア -->
    <div class="left-panel">
        <div class="theme-badge">テーマ：解きたい問題や目的をそのまま教えてね</div>
        
        <!-- カズ先生のイラスト＆メッセージ -->
        <div class="teacher-box">
            <div class="teacher-icon">
                <!-- 修正：画像切れを防ぐフォールバック付きアイコン -->
                <img src="images/kazu_teacher.png" alt="カズ先生" onerror="this.outerHTML='<span>カズ</span>';">
            </div>
            <div id="teacherMessage" class="teacher-message">
                こんにちは、けんし君！解きたい式や問題を、下のマイクボタンや手書きで教えてね。一緒にがんばろう！
            </div>
        </div>

        <!-- 手書きキャンバス -->
        <div class="canvas-container">
            <canvas id="drawCanvas"></canvas>
        </div>

        <!-- ボタン類 -->
        <div class="action-buttons">
            <button class="btn-voice" onclick="startVoiceInput()">🎤 おはなし（タップで開始）</button>
            <button class="btn-submit" onclick="sendHandwriting()">✏️ 手書き送信</button>
        </div>

        <div id="statusBar" class="status-bar"></div>
    </div>

    <!-- 右側：対話ログエリア -->
    <div class="right-panel">
        <div class="log-header">対話ログ（ここを押すとその時に戻れるよ）</div>
        <div id="dialogLog" class="log-content">ここにやり取りの履歴がたまっていくよ</div>
    </div>
</div>

<script>
    // 【根本修正】エラーで指定されていた最新モデル gemini-3.6-flash へ変更
    const API_MODEL = "gemini-3.6-flash";
    
    // キャンバスの描画設定
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // マウス・タッチ操作のバインド
    canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
    canvas.addEventListener('mousemove', (e) => { if (isDrawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } });
    canvas.addEventListener('mouseup', () => { isDrawing = false; });
    canvas.addEventListener('touchstart', (e) => {
        isDrawing = true;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        ctx.beginPath();
        ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
        e.preventDefault();
    });
    canvas.addEventListener('touchmove', (e) => {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
        ctx.stroke();
        e.preventDefault();
    });
    canvas.addEventListener('touchend', () => { isDrawing = false; });

    // 【修正】音声入力の即時エラー落ち対策
    function startVoiceInput() {
        const status = document.getElementById('statusBar');
        const messageBox = document.getElementById('teacherMessage');

        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            status.textContent = "エラー: お使いのブラウザは音声認識に対応していません。";
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = false;

        recognition.onstart = () => {
            status.textContent = "音声を聞き取り中...話終わったらボタンを押してね";
            messageBox.textContent = "しっかり聞いてるよ、続けて話してね！";
        };

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            status.textContent = "聞き取り成功: " + text;
            messageBox.textContent = `「${text}」だね。一緒に考えていこう！`;
            appendLog("ユーザー(音声): " + text);
        };

        recognition.onerror = (event) => {
            status.textContent = "音声認識通知: " + event.error + " (もう一度お話ししてね)";
        };

        try {
            recognition.start();
        } catch (e) {
            status.textContent = "音声認識の起動に失敗しました: " + e.message;
        }
    }

    // 【修正】手書き送信処理（gemini-3.6-flash 対応）
    async function sendHandwriting() {
        const status = document.getElementById('statusBar');
        const messageBox = document.getElementById('teacherMessage');
        const imageData = canvas.toDataURL('image/png');
        
        status.textContent = "手書きデータを解析中...";

        try {
            /* 
               ※ 実際のAPI呼び出し部分
               const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${API_MODEL}:generateContent?key=YOUR_API_KEY`, {
                   method: 'POST',
                   headers: { 'Content-Type': 'application/json' },
                   body: JSON.stringify({
                       contents: [{
                           parts: [
                               { text: "この手書きの計算式を読み取って解説して。" },
                               { inline_data: { mime_type: "image/png", data: imageData.split(',')[1] } }
                           ]
                       }]
                   })
               });
               if (!response.ok) {
                   const err = await response.json();
                   throw new Error(err.error?.message || response.statusText);
               }
               const result = await response.json();
            */

            // 成功時のシミュレーション動作確認
            status.textContent = "送信完了！";
            messageBox.textContent = "なるほど、この筆算を一緒に解いていこう！";
            appendLog("手書きデータを送信しました。");

        } catch (error) {
            status.textContent = `通信エラー: ${error.message}`;
            messageBox.textContent = "おっと、通信エラーみたい。もう一度送ってみてね！";
        }
    }

    function appendLog(text) {
        const logArea = document.getElementById('dialogLog');
        if (logArea.textContent.includes("ここにやり取りの履歴")) {
            logArea.textContent = "";
        }
        const p = document.createElement('div');
        p.textContent = text;
        logArea.appendChild(p);
    }
</script>

</body>
</html>
