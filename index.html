<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI学習コーチ - カズ先生 (v9.0 Splat Edition)</title>
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <style>
        :root {
            --splat-yellow: #CCFF00;
            --splat-purple: #7B00FF;
            --splat-cyan: #00F0FF;
            --splat-pink: #FF0055;
            --splat-bg: #0B0E14;
            --splat-card: #171B2C;
            --splat-border: #2B314F;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--splat-bg);
            overflow: hidden; display: flex; flex-direction: column; color: #FFF;
            user-select: none;
        }
        #config-bar {
            background: var(--splat-purple); color: #fff; padding: 4px 12px;
            display: flex; gap: 8px; align-items: center; font-size: 11px;
            border-bottom: 3px solid var(--splat-yellow);
        }
        #config-bar input {
            flex: 1; padding: 4px 8px; border-radius: 6px; border: none;
            font-size: 11px; background: #1E1235; color: #FFF; font-weight: bold;
        }
        header {
            height: 52px; background: var(--splat-card);
            border-bottom: 4px solid var(--splat-yellow);
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
        }
        #avatar-box { display: flex; align-items: center; gap: 10px; }
        .character-title { display: flex; flex-direction: column; }
        .character-name { font-weight: 900; font-size: 15px; color: var(--splat-yellow); text-shadow: 2px 2px 0px #000; letter-spacing: 0.5px; }
        .character-sub { font-size: 10px; color: #8F94B2; font-weight: bold; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .btn-tab {
            background: var(--splat-purple); color: #FFF; border: 2px solid var(--splat-yellow);
            padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; cursor: pointer;
            box-shadow: 0 3px 0 #000; transition: transform 0.1s;
        }
        .btn-tab:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }

        main {
            flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px;
            overflow: hidden; position: relative; max-width: 700px; width: 100%; margin: 0 auto; box-sizing: border-box;
        }
        
        #user-comment-frame {
            background: #151A2E; border: 2px solid var(--splat-cyan);
            border-radius: 12px; padding: 6px 12px; display: none; align-items: center; gap: 8px;
            box-shadow: 0 3px 12px rgba(0,240,255,0.25);
        }
        .user-comment-label { font-size: 11px; color: var(--splat-cyan); font-weight: 900; white-space: nowrap; }
        .user-comment-text { font-size: 12px; color: #FFF; word-break: break-all; font-weight: bold; }

        #board-container {
            flex: 1; background: var(--splat-card); border-radius: 20px;
            border: 4px solid var(--splat-yellow); box-shadow: 0 8px 24px rgba(123,0,255,0.4);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .board-header {
            padding: 6px 14px; background: rgba(0,0,0,0.4); font-size: 11px;
            color: #8F94B2; font-weight: 900; border-bottom: 2px solid var(--splat-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        #board-content {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; padding: 10px; text-align: center; gap: 8px; position: relative;
            overflow-y: auto;
        }
        
        /* スプラトゥーン風ステージ・アバター */
        .manga-stage {
            display: flex; gap: 12px; align-items: center; width: 96%;
            background: rgba(0,0,0,0.35); border: 3px solid var(--splat-purple); border-radius: 16px; padding: 8px 12px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
        }
        #teacher-avatar-svg { width: 64px; height: 64px; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        
        /* 動的SVG図解エリア */
        #visual-container {
            display: none; width: 96%; background: #0D101A;
            border: 2px solid var(--splat-cyan); border-radius: 12px; padding: 8px; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }
        #visual-svg { width: 100%; height: 130px; }

        #preview-container { display: none; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
        #preview-img { max-height: 60px; border-radius: 8px; border: 2px solid var(--splat-yellow); }

        .board-text-title { font-size: 13px; font-weight: 900; color: var(--splat-cyan); text-shadow: 1px 1px 0px #000; align-self: flex-start; margin-left: 2%; display: flex; align-items: center; gap: 4px;}
        
        /* ホワイトボード本文：チョーク風テキストエリア */
        .board-text-body { 
            font-size: 15px; color: #FFF; line-height: 1.5; 
            text-align: left; width: 96%; 
            padding: 12px 16px; box-sizing: border-box; 
            background: #111522; border-radius: 14px; border: 2px solid var(--splat-border);
            font-weight: bold; min-height: 70px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
            letter-spacing: 0.3px;
        }
        
        #coaching-control-bar {
            display: none; padding: 8px; background: rgba(0,0,0,0.7);
            border-top: 3px solid var(--splat-yellow); gap: 8px; justify-content: center; flex-wrap: wrap;
            z-index: 10;
        }
        .btn-coach {
            border: none; border-radius: 14px; font-weight: 900; font-size: 11px; cursor: pointer;
            padding: 9px 14px; box-shadow: 0 3px 0 rgba(0,0,0,0.4); transition: transform 0.1s;
        }
        .btn-coach:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-coach:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
        #btn-easier { background: var(--splat-cyan); color: #0B0E14; }
        #btn-next-step { background: var(--splat-yellow); color: #0B0E14; }
        #btn-solved { background: var(--splat-pink); color: #FFF; }

        .action-bar { padding: 4px 0; display: flex; gap: 12px; justify-content: center; }
        .btn-action {
            border: none; border-radius: 24px; font-weight: 900; font-size: 13px; cursor: pointer;
            padding: 12px 24px; color: #0B0E14; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.4); transition: transform 0.1s; letter-spacing: 0.5px;
        }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-action:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
        #btn-q { background: var(--splat-yellow); }
        #btn-cam { background: var(--splat-cyan); }
        
        .modal-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 100; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        }
        #camera-video { width: 92%; max-width: 420px; max-height: 60vh; border-radius: 16px; border: 3px solid var(--splat-yellow); object-fit: cover; }
        
        .modal-box { width: 90%; max-width: 420px; background: var(--splat-card); border: 3px solid var(--splat-yellow); border-radius: 16px; padding: 18px; max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; text-align: center; }
        .history-item { background: rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--splat-border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .history-item:hover { background: rgba(123,0,255,0.3); border-color: var(--splat-yellow); }

        /* チョークのタイピングカーソル演出 */
        .typing-cursor::after {
            content: '✏️';
            animation: blink 0.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* しゃべっているときの口パクアニメーション */
        @keyframes talkMouth {
            0% { d: path("M 30 60 Q 50 80 70 60"); }
            50% { d: path("M 30 65 Q 50 50 70 65"); }
            100% { d: path("M 30 60 Q 50 80 70 60"); }
        }
        .speaking #mouth-path {
            animation: talkMouth 0.3s infinite;
        }
    </style>
</head>
<body>

    <div id="config-bar">
        <span>API Key:</span>
        <input type="password" id="api-key-input" placeholder="Gemini APIキーを入力 (有料枠推奨)">
    </div>

    <header>
        <div id="avatar-box">
            <svg width="38" height="38" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="var(--splat-purple)" stroke="var(--splat-yellow)" stroke-width="6"/>
                <circle cx="35" cy="40" r="7" fill="var(--splat-yellow)"/>
                <circle cx="65" cy="40" r="7" fill="var(--splat-yellow)"/>
                <path d="M 35 65 Q 50 75 65 65" stroke="var(--splat-yellow)" stroke-width="5" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="character-title">
                <span class="character-name">カズ先生のホワイトボード</span>
                <span class="character-sub">小4 算数コーチング (v9.0 Splat)</span>
            </div>
        </div>
        <div class="header-btns">
            <button class="btn-tab" id="btn-new-session">＋ 新規相談</button>
            <button class="btn-tab" id="btn-history-list">📖 履歴</button>
        </div>
    </header>

    <main>
        <div id="user-comment-frame">
            <span class="user-comment-label">🗣️ キミの言葉:</span>
            <span class="user-comment-text" id="user-comment-text"></span>
        </div>

        <div id="board-container">
            <div class="board-header">
                <span id="board-status">【ステータス：伴走待機中】</span>
                <span id="session-title-badge">テーマ: 新規相談</span>
            </div>
            
            <div id="board-content">
                <div class="manga-stage" id="manga-stage">
                    <svg id="teacher-avatar-svg" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" fill="var(--splat-purple)" stroke="var(--splat-yellow)" stroke-width="6"/>
                        <!-- 目 -->
                        <circle cx="35" cy="40" r="7" fill="var(--splat-yellow)" id="eye-l"/>
                        <circle cx="65" cy="40" r="7" fill="var(--splat-yellow)" id="eye-r"/>
                        <!-- 眉毛 -->
                        <line x1="25" y1="28" x2="45" y2="32" stroke="var(--splat-yellow)" stroke-width="4" stroke-linecap="round" id="brow-l"/>
                        <line x1="55" y1="32" x2="75" y2="28" stroke="var(--splat-yellow)" stroke-width="4" stroke-linecap="round" id="brow-r"/>
                        <!-- 口 -->
                        <path id="mouth-path" d="M 30 60 Q 50 80 70 60" stroke="var(--splat-yellow)" stroke-width="6" fill="none" stroke-linecap="round"/>
                    </svg>
                    <div style="font-size: 12px; color: var(--splat-yellow); text-align: left; font-weight: 900; text-shadow: 1px 1px 0 #000;">
                        熱血！カズ先生<br><span id="teacher-mood" style="color:#FFF; font-size:11px; font-weight:bold;">「一緒にがんばろう！」</span>
                    </div>
                </div>

                <div id="visual-container">
                    <svg id="visual-svg" viewBox="0 0 400 120"></svg>
                </div>

                <div id="preview-container">
                    <img id="preview-img" alt="問題プレビュー">
                </div>
                
                <div class="board-text-title" id="board-title"><span>📝</span> カズ先生からのホワイトボード解説</div>
                <div class="board-text-body" id="board-speech">
                    こんにちは！解きたい問題を「カメラ」で写すか、<br>
                    「質問する」ボタンから話しかけてね！最後まで一緒に伴走するよ。
                </div>
            </div>
            
            <div id="coaching-control-bar">
                <button class="btn-coach" id="btn-easier">💡 もっとわかりやすく</button>
                <button class="btn-coach" id="btn-next-step">➡️ つぎへ進む</button>
                <button class="btn-coach" id="btn-solved">👍 わかった！</button>
            </div>

            <div id="camera-modal" class="modal-overlay">
                <video id="camera-video" autoplay playsinline muted></video>
                <div style="display: flex; gap: 12px;">
                    <button class="btn-action" id="snap-btn" style="background: var(--splat-yellow);">📷 しゃしんをとる</button>
                    <button class="btn-action" id="close-cam-btn" style="background: #8F94B2; color:#000;">やめる</button>
                </div>
            </div>

            <div id="history-modal" class="modal-overlay">
                <div class="modal-box" style="text-align: left;">
                    <div style="font-weight:900; color:var(--splat-yellow); font-size:16px; margin-bottom:4px;">📖 これまでの相談ルーム</div>
                    <div id="history-list-container" style="display:flex; flex-direction:column; gap:8px;"></div>
                    <button class="btn-action" id="close-history-btn" style="background: #8F94B2; color:#000; width:100%; justify-content:center; margin-top:8px;">とじる</button>
                </div>
            </div>

            <div id="solved-modal" class="modal-overlay">
                <div class="modal-box" style="align-items: center;">
                    <div style="font-weight:900; color:var(--splat-yellow); font-size:18px; text-shadow: 1px 1px 0 #000;">よくがんばったね！🎉</div>
                    <div style="font-size:13px; color:#FFF; line-height:1.5; font-weight:bold;">この相談をどうする？</div>
                    <button class="btn-coach" id="btn-end-session" style="background: var(--splat-pink); color:#FFF; width:100%; font-size:13px; padding:12px;">🏁 相談を終了して履歴に保存する</button>
                    <button class="btn-coach" id="btn-continue-session" style="background: var(--splat-yellow); color:#0B0E14; width:100%; font-size:13px; padding:12px;">✏️ 引き続きこの相談を続ける</button>
                </div>
            </div>
        </div>

        <div class="action-bar" id="main-action-bar">
            <button class="btn-action" id="btn-q">🎙️ 質問する</button>
            <button class="btn-action" id="btn-cam">📷 カメラ</button>
        </div>
    </main>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        console.log("Kazu-sensei Board v9.0 Splat Edition loaded.");

        const apiKeyInput = document.getElementById('api-key-input');
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        });

        const boardSpeech = document.getElementById('board-speech');
        const boardTitle = document.getElementById('board-title');
        const boardStatus = document.getElementById('board-status');
        const sessionTitleBadge = document.getElementById('session-title-badge');
        const userCommentFrame = document.getElementById('user-comment-frame');
        const userCommentText = document.getElementById('user-comment-text');
        const teacherMood = document.getElementById('teacher-mood');
        const visualContainer = document.getElementById('visual-container');
        const visualSvg = document.getElementById('visual-svg');
        const mangaStage = document.getElementById('manga-stage');
        
        const btnCam = document.getElementById('btn-cam');
        const btnQ = document.getElementById('btn-q');
        const cameraModal = document.getElementById('camera-modal');
        const cameraVideo = document.getElementById('camera-video');
        const snapBtn = document.getElementById('snap-btn');
        const closeCamBtn = document.getElementById('close-cam-btn');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');

        const historyModal = document.getElementById('history-modal');
        const historyListContainer = document.getElementById('history-list-container');
        const btnHistoryList = document.getElementById('btn-history-list');
        const closeHistoryBtn = document.getElementById('close-history-btn');
        const btnNewSession = document.getElementById('btn-new-session');

        const solvedModal = document.getElementById('solved-modal');
        const btnEndSession = document.getElementById('btn-end-session');
        const btnContinueSession = document.getElementById('btn-continue-session');
        const coachingControlBar = document.getElementById('coaching-control-bar');
        const btnEasier = document.getElementById('btn-easier');
        const btnNextStep = document.getElementById('btn-next-step');

        let currentSessionId = 'session_' + Date.now();
        let currentSessionTitle = '新規の相談';
        let chatHistory = []; 
        let mediaStream = null;
        let typingTimer = null;

        function setButtonsEnabled(enabled) {
            [btnCam, btnQ, btnEasier, btnNextStep].forEach(btn => {
                if (btn) btn.disabled = !enabled;
            });
        }

        // 表情とアニメーションの変化
        function setTeacherMood(mood, moodText) {
            teacherMood.innerText = `「${moodText}」`;
            const mouth = document.getElementById('mouth-path');
            const browL = document.getElementById('brow-l');
            const browR = document.getElementById('brow-r');

            if (mood === 'thinking') {
                mouth.setAttribute('d', 'M 35 68 Q 50 52 65 68');
                browL.setAttribute('y1', '32'); browL.setAttribute('y2', '26');
                browR.setAttribute('y1', '26'); browR.setAttribute('y2', '32');
            } else if (mood === 'happy') {
                mouth.setAttribute('d', 'M 28 55 Q 50 85 72 55');
                browL.setAttribute('y1', '26'); browL.setAttribute('y2', '32');
                browR.setAttribute('y1', '32'); browR.setAttribute('y2', '26');
            } else {
                mouth.setAttribute('d', 'M 30 60 Q 50 80 70 60');
                browL.setAttribute('y1', '28'); browL.setAttribute('y2', '32');
                browR.setAttribute('y1', '32'); browR.setAttribute('y2', '28');
            }
        }

        // 動的SVG図解（よりリッチなアニメーション表現）
        function renderVisualDiagram(type) {
            visualSvg.innerHTML = '';
            if (!type || type === 'none') {
                visualContainer.style.display = 'none';
                return;
            }
            visualContainer.style.display = 'flex';

            if (type === 'bars') {
                visualSvg.innerHTML = `
                    <text x="15" y="22" fill="#00F0FF" font-size="11" font-weight="900">【線分図・割合ビジュアル】</text>
                    <line x1="20" y1="50" x2="380" y2="50" stroke="#CCFF00" stroke-width="5" stroke-linecap="round"/>
                    <line x1="20" y1="38" x2="20" y2="62" stroke="#CCFF00" stroke-width="4" stroke-linecap="round"/>
                    <line x1="380" y1="38" x2="380" y2="62" stroke="#CCFF00" stroke-width="4" stroke-linecap="round"/>
                    <rect x="20" y="75" width="220" height="25" fill="#7B00FF" stroke="#00F0FF" stroke-width="2" rx="6"/>
                    <text x="110" y="92" fill="#FFF" font-size="11" font-weight="bold" text-anchor="middle">もとにする量</text>
                    <rect x="245" y="75" width="135" height="25" fill="#FF0055" stroke="#CCFF00" stroke-width="2" rx="6"/>
                    <text x="312" y="92" fill="#FFF" font-size="11" font-weight="bold" text-anchor="middle">比べられる量</text>
                `;
            } else if (type === 'blocks') {
                let rects = '';
                for(let i=0; i<4; i++) {
                    rects += `<rect x="${25 + i*90}" y="35" width="75" height="50" fill="#7B00FF" stroke="#CCFF00" stroke-width="3" rx="8"/>`;
                    rects += `<text x="${62 + i*90}" y="65" fill="#FFF" font-size="16" font-weight="900" text-anchor="middle">${i+1}つ分</text>`;
                }
                visualSvg.innerHTML = `<text x="15" y="22" fill="#00F0FF" font-size="11" font-weight="900">【ブロック面積図】</text>` + rects;
            } else if (type === 'decimals') {
                visualSvg.innerHTML = `
                    <text x="15" y="22" fill="#00F0FF" font-size="11" font-weight="900">【小数・位取りイメージ】</text>
                    <rect x="30" y="40" width="80" height="50" fill="#7B00FF" stroke="#CCFF00" stroke-width="3" rx="6"/>
                    <text x="70" y="70" fill="#FFF" font-size="16" font-weight="900" text-anchor="middle">1の位</text>
                    <text x="130" y="70" fill="#CCFF00" font-size="20" font-weight="900">.</text>
                    <rect x="150" y="40" width="80" height="50" fill="#FF0055" stroke="#00F0FF" stroke-width="3" rx="6"/>
                    <text x="190" y="70" fill="#FFF" font-size="16" font-weight="900" text-anchor="middle">0.1の位</text>
                    <rect x="270" y="40" width="80" height="50" fill="#00F0FF" stroke="#7B00FF" stroke-width="3" rx="6"/>
                    <text x="310" y="70" fill="#0B0E14" font-size="16" font-weight="900" text-anchor="middle">0.01</text>
                `;
            }
        }

        // ホワイトボードにチョークで文字を書き込むようなリアルタイム・タイピングアニメーション
        function typeWriterEffect(htmlText, callback) {
            if (typingTimer) clearInterval(typingTimer);
            boardSpeech.innerHTML = '';
            boardSpeech.classList.add('typing-cursor');

            const plainText = htmlText.replace(/<br>/g, '\n');
            let charIndex = 0;
            
            typingTimer = setInterval(() => {
                if (charIndex < plainText.length) {
                    const currentStr = plainText.substring(0, charIndex + 1).replace(/\n/g, '<br>');
                    boardSpeech.innerHTML = currentStr;
                    charIndex++;
                } else {
                    clearInterval(typingTimer);
                    boardSpeech.classList.remove('typing-cursor');
                    boardSpeech.innerHTML = htmlText; 
                    if (callback) callback();
                }
            }, 20); // 速度を少し上げてサクサク表示
        }

        function saveCurrentSession() {
            if (chatHistory.length === 0) return;
            const sessions = JSON.parse(localStorage.getItem('kazu_sessions_v9') || '{}');
            sessions[currentSessionId] = {
                title: currentSessionTitle,
                updatedAt: new Date().toLocaleString(),
                history: chatHistory,
                lastSpeech: boardSpeech.innerHTML
            };
            localStorage.setItem('kazu_sessions_v9', JSON.stringify(sessions));
        }

        function loadSessionList() {
            historyListContainer.innerHTML = '';
            const sessions = JSON.parse(localStorage.getItem('kazu_sessions_v9') || '{}');
            const keys = Object.keys(sessions);
            
            if (keys.length === 0) {
                historyListContainer.innerHTML = '<div style="font-size:12px; color:#8F94B2; text-align:center; padding:10px;">まだ保存された相談はありません</div>';
                return;
            }

            keys.reverse().forEach(key => {
                const s = sessions[key];
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<div><div style="font-weight:bold; font-size:13px; color:#FFF;">${s.title}</div><div style="font-size:10px; color:#8F94B2;">${s.updatedAt}</div></div><span style="font-size:12px; color:var(--splat-yellow); font-weight:900;">つづきへ ➔</span>`;
                div.onclick = () => {
                    currentSessionId = key;
                    currentSessionTitle = s.title;
                    chatHistory = s.history || [];
                    sessionTitleBadge.innerText = `テーマ: ${currentSessionTitle}`;
                    boardSpeech.innerHTML = s.lastSpeech || "前の続きから再開するよ！";
                    speakText(boardSpeech.innerText);
                    historyModal.style.display = 'none';
                    coachingControlBar.style.display = 'flex';
                    setTeacherMood('happy', 'よく戻ってきてくれたね！');
                    updateBoard("伴走中（履歴から再開）", "カズ先生のホワイトボード解説");
                };
                historyListContainer.appendChild(div);
            });
        }

        btnNewSession.addEventListener('click', () => {
            saveCurrentSession();
            currentSessionId = 'session_' + Date.now();
            currentSessionTitle = '新規の相談';
            chatHistory = [];
            sessionTitleBadge.innerText = `テーマ: 新規の相談`;
            previewContainer.style.display = 'none';
            userCommentFrame.style.display = 'none';
            coachingControlBar.style.display = 'none';
            boardTitle.style.display = 'flex';
            visualContainer.style.display = 'none';
            setTeacherMood('normal', '新しい問題だね！');
            updateBoard("新規ルーム", "カズ先生からのメッセージ", "新しい相談ルームだよ！解きたい問題を教えてね。");
        });

        btnHistoryList.addEventListener('click', () => {
            loadSessionList();
            historyModal.style.display = 'flex';
        });

        closeHistoryBtn.addEventListener('click', () => {
            historyModal.style.display = 'none';
        });

        function updateBoard(statusText, titleText, speechText = null, userText = null, mood = 'normal', moodText = '一緒にがんばろう！', diagType = 'none') {
            boardStatus.innerText = `【ステータス：${statusText}】`;
            if (titleText) boardTitle.innerHTML = `<span>📝</span> ${titleText}`;
            
            if (userText) {
                userCommentFrame.style.display = 'flex';
                userCommentText.innerText = userText;
            } else {
                userCommentFrame.style.display = 'none';
            }

            setTeacherMood(mood, moodText);
            renderVisualDiagram(diagType);

            if (speechText) {
                typeWriterEffect(speechText, () => {
                    speakText(speechText);
                });
                coachingControlBar.style.display = 'flex';
            }
        }

        // 音声合成とアニメーション連動
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/<[^>]*>?/gm, '');
            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = 'ja-JP';
            utter.rate = 1.1; 
            utter.pitch = 1.05;

            utter.onstart = () => {
                mangaStage.classList.add('speaking');
            };
            utter.onend = () => {
                mangaStage.classList.remove('speaking');
            };
            utter.onerror = () => {
                mangaStage.classList.remove('speaking');
            };

            window.speechSynthesis.speak(utter);
        }

        async function askGemini(userInputText, base64Image = null, userDisplayText = null) {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                updateBoard("エラー", "APIキー未入力", "上の欄に Gemini APIキー を入力してね！有料枠のキーがおすすめだよ。", userDisplayText, 'normal', 'APIキーを入れてね');
                return;
            }

            setButtonsEnabled(false);
            setTeacherMood('thinking', 'うーん、どうアプローチしようかな…');

            try {
                const ai = new GoogleGenAI({ apiKey: apiKey });

                const systemInstruction = `あなたは小学4年生の算数専用の、熱血でテンションが高くやさしいアニメ風の指導者「カズ先生」です。
コーチングの絶対ルール：
1. **答えや計算結果を直接教えないこと**。
2. 子供が自分の足でヒントから答えにたどり着くように伴走する。
3. ホワイトボードに書き込むように、熱血かつ分かりやすく3〜4行程度でまとめる。
4. 返答の最後に必ず図解の種類として【図解:bars】（線分図や割合）、【図解:blocks】（ブロック面積図）、【図解:decimals】（小数や位取り）、または【図解:none】のいずれかを含めて指定すること。`;

                let parts = [];
                if (base64Image) {
                    parts.push({
                        inlineData: {
                            mimeType: "image/jpeg",
                            data: base64Image.split(',')[1]
                        }
                    });
                }
                if (userInputText) {
                    parts.push(userInputText);
                }

                chatHistory.push({ role: 'user', parts: parts });

                if (currentSessionTitle === '新規の相談' && userInputText && !base64Image) {
                    currentSessionTitle = userInputText.slice(0, 15) + (userInputText.length > 15 ? '...' : '');
                    sessionTitleBadge.innerText = `テーマ: ${currentSessionTitle}`;
                } else if (currentSessionTitle === '新規の相談' && base64Image) {
                    currentSessionTitle = '算数の問題の相談';
                    sessionTitleBadge.innerText = `テーマ: ${currentSessionTitle}`;
                }

                const cleanContents = chatHistory.map(turn => ({
                    role: turn.role,
                    parts: turn.parts.map(p => {
                        if (typeof p === 'string') return { text: p };
                        if (p.text) return { text: p.text };
                        if (p.inlineData) return { inlineData: p.inlineData };
                        return { text: String(p) };
                    })
                }));

                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: cleanContents,
                    config: {
                        systemInstruction: systemInstruction,
                    }
                });

                if (response && response.text) {
                    let rawText = response.text;
                    let diagType = 'none';
                    if (rawText.includes('【図解:bars】')) { diagType = 'bars'; rawText = rawText.replace('【図解:bars】', ''); }
                    else if (rawText.includes('【図解:blocks】')) { diagType = 'blocks'; rawText = rawText.replace('【図解:blocks】', ''); }
                    else if (rawText.includes('【図解:decimals】')) { diagType = 'decimals'; rawText = rawText.replace('【図解:decimals】', ''); }
                    else { rawText = rawText.replace(/【図解:.*?】/g, ''); }

                    const replyText = rawText.trim().replace(/\n/g, '<br>');
                    chatHistory.push({ role: 'model', parts: [{ text: response.text }] });
                    
                    updateBoard("伴走コーチング中", "カズ先生のホワイトボード解説", replyText, userDisplayText, 'happy', 'ひらめいたよ！一緒に解こう！', diagType);
                    saveCurrentSession();
                } else {
                    updateBoard("エラー", "データなし", "ホワイトボードに文字を書けませんでした。", userDisplayText, 'normal', '困ったな…');
                }
            } catch (err) {
                console.error("SDK Error:", err);
                if (err.message && err.message.includes("429")) {
                    updateBoard("制限オーバー", "少し待ってね", "アクセスが集中しました。有料枠のキーが正しく設定されているか確認してね！", userDisplayText, 'normal', '少し休憩しよう');
                } else {
                    updateBoard("エラー発生", "通信エラー", `詳細: ${err.message}`, userDisplayText, 'normal', 'エラーが起きちゃった');
                }
            } finally {
                setButtonsEnabled(true);
            }
        }

        btnCam.addEventListener('click', async () => {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert('お使いのブラウザはカメラに対応していません。');
                    return;
                }
                updateBoard("カメラ起動中", "問題の読み取り", "ノートをカメラにしっかり写してね！", null, 'normal', 'カメラで問題を見せてね');
                cameraModal.style.display = 'flex';
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                cameraVideo.srcObject = mediaStream;
            } catch (err) {
                alert('カメラをひらけませんでした: ' + err.message);
                cameraModal.style.display = 'none';
                updateBoard("待機中", "カズ先生からのメッセージ", "カメラが開けなかったよ。", null, 'normal', 'カメラが開けないよ');
            }
        });

        snapBtn.addEventListener('click', () => {
            const canvas = document.getElementById('capture-canvas');
            canvas.width = cameraVideo.videoWidth || 640;
            canvas.height = cameraVideo.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
            
            const capturedBase64 = canvas.toDataURL('image/jpeg');
            previewImg.src = capturedBase64;
            
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            cameraModal.style.display = 'none';

            boardTitle.style.display = 'flex';
            previewContainer.style.display = 'flex';
            
            askGemini("このノートの問題を見て、答えを言わずに、最初のヒントをホワイトボードに分かりやすく熱血に教えてください。", capturedBase64, "カメラで問題を撮影して相談しました");
        });

        closeCamBtn.addEventListener('click', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            cameraModal.style.display = 'none';
            updateBoard("待機中", "カズ先生からのメッセージ", "カメラを閉じました。いつでも質問してね！", null, 'normal', 'いつでも聞いてね');
        });

        btnQ.addEventListener('click', () => {
            previewContainer.style.display = 'none';
            boardTitle.style.display = 'flex';
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.interimResults = false;

                recognition.onstart = () => {
                    updateBoard("音声聞き取り中", "質問を受け付けています", "マイクに向かってハッキリ話してね……", null, 'thinking', '耳をすませているよ…');
                };

                recognition.onresult = (event) => {
                    const speechResult = event.results[0][0].transcript;
                    askGemini(`生徒からの発言・質問: ${speechResult}`, null, speechResult);
                };

                recognition.onerror = () => {
                    updateBoard("聞き取り失敗", "もう一度お試しください", "うまく聞き取れなかったよ。もう一度マイクボタンを押して話してね！", null, 'normal', 'もう一度教えて！');
                };

                recognition.start();
            } else {
                updateBoard("テキスト入力モード", "質問受付", "音声認識が使えない環境のため、テキストで質問してください。", null, 'normal', 'テキストで教えてね');
                askGemini("小4の算数について質問があります。答えを言わずにヒントを教えてください。", null, "テキストで質問しました");
            }
        });

        btnEasier.addEventListener('click', () => {
            askGemini("今のヒントがちょっと難しかったよ。もっと身近な例え話や、別の噛み砕いた解説を教えて！", null, "もっとわかりやすく教えて！");
        });

        btnNextStep.addEventListener('click', () => {
            askGemini("今の内容はわかったよ！次のステップに進むためのヒントを教えて。", null, "つぎへ進む");
        });

        document.getElementById('btn-solved').addEventListener('click', () => {
            solvedModal.style.display = 'flex';
        });

        btnEndSession.addEventListener('click', () => {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            solvedModal.style.display = 'none';
            previewContainer.style.display = 'none';
            visualContainer.style.display = 'none';
            boardTitle.style.display = 'flex';
            
            const cheers = "すごい！今回の相談はこれにて大クリア！しっかり相談履歴に保存したよ。次の問題もこの調子でがんばろう！";
            updateBoard("完了・保存済", "カズ先生からのメッセージ", cheers, "わかった！相談を終了して保存するよ", 'happy', 'お疲れ様！大正解！');
            
            chatHistory.push({ role: 'user', parts: [{ text: "わかった！" }] });
            chatHistory.push({ role: 'model', parts: [{ text: cheers }] });
            saveCurrentSession();
            
            coachingControlBar.style.display = 'none';
            currentSessionId = 'session_' + Date.now();
            currentSessionTitle = '新規の相談';
            chatHistory = [];
            sessionTitleBadge.innerText = `テーマ: 新規の相談`;
        });

        btnContinueSession.addEventListener('click', () => {
            solvedModal.style.display = 'none';
            updateBoard("伴走継続中", "カズ先生のホワイトボード解説", "よし、この調子でどんどん質問してね！次の疑問は何かな？", "引き続きこの相談を続ける", 'happy', 'まだまだいけるよ！');
        });
    </script>
</body>
</html>
