<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI学習コーチ - カズくん</title>
    <style>
        :root {
            --splat-yellow: #E6FF00;
            --splat-purple: #6E00FF;
            --splat-pink: #FF007F;
            --splat-bg: #111420;
            --splat-card: #1E2235;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Arial Black', sans-serif; background: var(--splat-bg);
            overflow: hidden; display: flex; flex-direction: column; color: #FF0000;
            user-select: none;
        }
        #config-bar {
            background: var(--splat-purple); color: #fff; padding: 6px 12px;
            display: flex; gap: 8px; align-items: center; font-size: 12px;
            border-bottom: 2px solid var(--splat-yellow);
        }
        #config-bar input {
            flex: 1; padding: 4px 8px; border-radius: 6px; border: none;
            font-size: 12px; background: #2A1F45; color: #FF0000;
        }
        header {
            height: 52px; background: var(--splat-card);
            border-bottom: 3px solid var(--splat-yellow);
            display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
        }
        #avatar-box { display: flex; align-items: center; gap: 10px; }
        .character-title { display: flex; flex-direction: column; }
        .character-name { font-weight: 900; font-size: 15px; color: var(--splat-yellow); text-shadow: 1px 1px 0px #000; }
        .character-sub { font-size: 10px; color: #A0A5C0; }
        .header-btns { display: flex; gap: 6px; align-items: center; }
        .btn-report {
            background: var(--splat-purple); color: #FF0000; border: 1.5px solid var(--splat-yellow);
            padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;
        }
        main {
            flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px;
            overflow: hidden; position: relative;
        }
        #board-container {
            flex: 1; background: var(--splat-card); border-radius: 16px;
            border: 3px solid var(--splat-yellow); box-shadow: 0 4px 16px rgba(110,0,255,0.25);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .board-header {
            padding: 8px 14px; background: rgba(0,0,0,0.4); font-size: 11px;
            color: #A0A5C0; font-weight: bold; border-bottom: 2px solid #2A1F45;
        }
        #board-content {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 16px; text-align: center; gap: 12px; position: relative;
        }
        .math-display { font-size: 28px; font-weight: 900; color: var(--splat-yellow); text-shadow: 2px 2px 0px #000; letter-spacing: 1px; }
        .math-subtext { font-size: 14px; color: #FFF; line-height: 1.5; background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 12px; border: 4px solid var(--splat-yellow); width: 90%; max-width: 500px; box-sizing: border-box; text-align: left; }
        #preview-container { display: none; flex-direction: column; align-items: center; gap: 8px; width: 100%; height: 100%; justify-content: center; }
        #preview-img { max-height: 180px; border-radius: 8px; border: 2px solid var(--splat-yellow); }
        #speech-banner {
            background: rgba(17, 20, 32, 0.95); border: 2px solid var(--splat-yellow);
            border-radius: 14px; padding: 12px 16px; color: #FF0000; font-size: 14px; line-height: 1.4;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .action-bar { padding: 0 10px 10px; display: flex; gap: 8px; justify-content: center; }
        .btn-action {
            border: none; border-radius: 24px; font-weight: 900; font-size: 14px; cursor: pointer;
            padding: 12px 20px; color: #111420; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        #btn-q { background: var(--splat-yellow); }
        #btn-cam { background: #00F0FF; }
        #btn-ok { background: var(--splat-pink); color: #FF0000; }
        #camera-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        }
        #camera-video { width: 90%; max-width: 400px; border-radius: 12px; border: 2px solid var(--splat-yellow); }
    </style>
</head>
<body>

    <div id="config-bar">
        <span>Gemini API Key:</span>
        <input type="password" id="api-key-input" placeholder="APIキーを入力してね">
    </div>

    <header>
        <div id="avatar-box">
            <svg width="44" height="44" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#6E00FF" stroke="#E6FF00" stroke-width="8"/>
                <circle cx="35" cy="40" r="8" fill="#E6FF00"/>
                <circle cx="65" cy="40" r="8" fill="#E6FF00"/>
                <path d="M 35 65 Q 50 80 65 65" stroke="#E6FF00" stroke-width="6" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="character-title">
                <span class="character-name">算数コーチ カズくん</span>
                <span class="character-sub">小4 算数専用パートナー</span>
            </div>
        </div>
        <div class="header-btns">
            <button class="btn-report" id="btn-log">ろぐ・そうだん</button>
        </div>
    </header>

    <main>
        <div id="board-container">
            <div class="board-header">COACH BOARD (解説・図解エリア)</div>
            <div id="board-content">
                <div class="math-display">きょうのめいけん</div>
                <div class="math-subtext" id="coach-speech">
                    こんにちは！きみのもんだいを見せてね。<br>「カメラ」でノートをうつすか、「質問する」でおしえてね！
                </div>
                <div id="preview-container">
                    <img id="preview-img" alt="プレビュー">
                    <span style="font-size: 11px; color: #A0A5C0;">この画像を読み込むよ！</span>
                </div>
            </div>
            
            <!-- カメラ撮影用モーダル -->
            <div id="camera-modal">
                <video id="camera-video" autoplay playsinline></video>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-action" id="snap-btn" style="background: var(--splat-yellow);">しゃしんをとる</button>
                    <button class="btn-action" id="close-cam-btn" style="background: #A0A5C0;">やめる</button>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn-action" id="btn-q">🎙️ 質問する</button>
            <button class="btn-action" id="btn-cam">📷 カメラ</button>
            <button class="btn-action" id="btn-ok">👍 わかった！</button>
        </div>
    </main>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <script>
        // APIキーの保存・復元
        const apiKeyInput = document.getElementById('api-key-input');
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        });

        // DOM要素
        const speechElem = document.getElementById('coach-speech');
        const btnCam = document.getElementById('btn-cam');
        const cameraModal = document.getElementById('camera-modal');
        const cameraVideo = document.getElementById('camera-video');
        const snapBtn = document.getElementById('snap-btn');
        const closeCamBtn = document.getElementById('close-cam-btn');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');
        const mathDisplay = document.querySelector('.math-display');

        let mediaStream = null;
        let capturedBase64 = null;

        // カメラ起動処理（iPadのSafari対応）
        btnCam.addEventListener('click', async () => {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert('お使いのブラウザはカメラに対応していません。');
                    return;
                }
                cameraModal.style.display = 'flex';
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: false 
                });
                cameraVideo.srcObject = mediaStream;
            } catch (err) {
                alert('カメラをひらけませんでした: ' + err.message);
                cameraModal.style.display = 'none';
            }
        });

        // 写真撮影
        snapBtn.addEventListener('click', () => {
            const canvas = document.getElementById('capture-canvas');
            canvas.width = cameraVideo.videoWidth || 640;
            canvas.height = cameraVideo.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
            
            capturedBase64 = canvas.toDataURL('image/jpeg');
            previewImg.src = capturedBase64;
            
            // プレビュー表示切り替え
            mathDisplay.style.display = 'none';
            speechElem.style.display = 'none';
            previewContainer.style.display = 'flex';

            stopCamera();
        });

        // カメラを閉じる・やめる
        closeCamBtn.addEventListener('click', () => {
            stopCamera();
            cameraModal.style.display = 'none';
        });

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        // 質問するボタン（音声認識のモック/簡易処理）
        document.getElementById('btn-q').addEventListener('click', () => {
            speechElem.innerHTML = "「先生、ここがわからないよ！」って声に出して教えてね。（音声入力準備中）";
        });

        // わかった！ボタン
        document.getElementById('btn-ok').addEventListener('click', () => {
            previewContainer.style.display = 'none';
            mathDisplay.style.display = 'block';
            speechElem.style.display = 'block';
            speechElem.innerHTML = "すごい！そのちょうしだね！ほかの問題もチャレンジしてみよう！";
            capturedBase64 = null;
        });
    </script>
</body>
</html>
