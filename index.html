<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カズ先生のホワイトボード (v11.4)</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --border-color: #2a3b5c;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .teacher-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-purple);
        }
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 16px;
            overflow: hidden;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .panel-header {
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-sub);
        }
        .panel-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-bubble {
            display: flex;
            gap: 10px;
            max-width: 85%;
        }
        .chat-bubble.teacher {
            align-self: flex-start;
        }
        .chat-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--accent-purple);
        }
        .chat-content {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }
        .footer-controls {
            padding: 12px 20px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-mic {
            background-color: var(--accent-purple);
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-mic.active {
            background-color: var(--accent-pink);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <!-- カズ先生の公式イラスト画像を確実に適用 -->
            <img src="image_7.png" alt="カズ先生" class="teacher-avatar-small" id="headerAvatar">
            <div>
                <h2>カズ先生のホワイトボード</h2>
                <p style="font-size: 12px; color: var(--text-sub);">小4 算数伴走コーチ (v11.4)</p>
            </div>
        </div>
        <button class="btn" style="background: var(--border-color); color: white;" onclick="alert('相談履歴を表示します')">相談履歴</button>
    </header>

    <div class="main-container">
        <!-- 左パネル：対話エリア -->
        <div class="panel">
            <div class="panel-header" id="statusText">【ステータス：待機中】</div>
            <div class="panel-body" id="chatLog">
                <div class="chat-bubble teacher">
                    <img src="image_7.png" alt="カズ先生" class="chat-avatar">
                    <div class="chat-content">
                        “しっかり聞いてるよ！解きたい問題や目的をそのまま教えてね”
                    </div>
                </div>
            </div>
        </div>

        <!-- 右パネル：手書き・ホワイトボードエリア -->
        <div class="panel">
            <div class="panel-header">手書きスペース (Apple Pencil対応・広々)</div>
            <div class="panel-body" style="display: flex; align-items: center; justify-content: center; color: var(--text-sub);">
                <p>ここに手書きのボードやメモが表示されます</p>
            </div>
        </div>
    </div>

    <!-- 常に表示されるフッターコントロール（消えないように固定） -->
    <footer class="footer-controls" id="footerControls">
        <button class="btn btn-mic" id="micBtn" onclick="toggleMic()">
            🎤 <span id="micLabel">音声入力を開始</span>
        </button>
        <button class="btn" style="background: var(--accent-purple); color: white;" onclick="sendFeedback('もっとわかりやすく')">もっとわかりやすく</button>
        <button class="btn" style="background: var(--accent-pink); color: white;" onclick="sendFeedback('わかった！')">わかった！</button>
    </footer>

    <script>
        let isListening = false;
        let recognition = null;

        // 音声認識の初期化（一瞬で途切れる現象を防止する堅牢な設定）
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = true;
            recognition.continuous = true; // 途切れにくくするために連続モードに設定

            recognition.onstart = function() {
                isListening = true;
                updateMicUI(true);
            };

            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('statusText').innerText = '【ステータス：音声認識中...】';
                // プレビュー表示などをここに追加可能
            };

            recognition.onerror = function(event) {
                console.error('Speech recognition error', event.error);
            };

            recognition.onend = function() {
                // 意図せずすぐ終了した場合の対策
                if (isListening) {
                    try {
                        recognition.start(); // 自動再開でセッション維持
                        return;
                    } catch (e) {
                        console.error(e);
                    }
                }
                isListening = false;
                updateMicUI(false);
            };
        }

        function toggleMic() {
            if (!recognition) {
                alert('お使いのブラウザは音声認識に対応していません。');
                return;
            }

            if (isListening) {
                isListening = false;
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function updateMicUI(active) {
            const btn = document.getElementById('micBtn');
            const label = document.getElementById('micLabel');
            const status = document.getElementById('statusText');
            
            if (active) {
                btn.classList.add('active');
                label.innerText = '音声入力中... (タップで停止)';
                status.innerText = '【ステータス：音声聞き取り中】';
            } else {
                btn.classList.remove('active');
                label.innerText = '音声入力を開始';
                status.innerText = '【ステータス：待機中】';
            }
        }

        function sendFeedback(type) {
            const chatLog = document.getElementById('chatLog');
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble teacher';
            bubble.innerHTML = `
                <img src="image_7.png" alt="カズ先生" class="chat-avatar">
                <div class="chat-content">“${type}”ですね！次のステップへ進みます。</div>
            `;
            chatLog.appendChild(bubble);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    </script>
</body>
</html>
