<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>小4算数伴走コーチ (v11.12 修正版)</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { flex: 1; background: #2a2a2a; padding: 20px; border-radius: 8px; border: 1px solid #444; }
        
        /* カズ先生のキャラクター・アバター表示エリア */
        .teacher-profile { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; background: #333; padding: 10px; border-radius: 6px; }
        .teacher-avatar { width: 50px; height: 50px; border-radius: 50%; background: #555; object-fit: cover; border: 2px solid #4CAF50; }
        .teacher-speech { font-size: 14px; background: #222; padding: 8px 12px; border-radius: 6px; flex: 1; }

        .handwriting-box { width: 100%; height: 150px; background: #111; border: 1px solid #555; border-radius: 4px; margin-bottom: 10px; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
        .error-log { color: #ff6b6b; font-family: monospace; font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <!-- 左側パネル：カズ先生との対話・手書き入力 -->
    <div class="panel">
        <div class="teacher-profile">
            <img id="teacherAvatar" class="teacher-avatar" src="images/kazu_teacher.png" alt="カズ先生" onerror="this.src='data:image/svg+xml;utf8<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\'><circle cx=\'25\' cy=\'25\' r=\'25\' fill=\'#4CAF50\'/><text x=\'25\' y=\'32\' font-size=\'14\' fill=\'white\' text-anchor=\'middle\'>カズ</text></svg>';">
            <div id="teacherMessage" class="teacher-speech">こんにちは、けんし君！解きたい式や問題を下のマイクボタンや手書きで教えてね。一緒にがんばろう！</div>
        </div>

        <div class="handwriting-box">
            <canvas id="drawCanvas" width="500" height="150" style="width:100%; height:100%;"></canvas>
        </div>
        
        <button onclick="startVoiceInput()">🎤 おはなし（タップで開始）</button>
        <button onclick="sendHandwriting()">✏️ 手書き送信</button>
        
        <div id="statusLog" class="error-log"></div>
    </div>
</div>

<script>
    // 【修正1】404エラーの原因となっていた古いモデル名を廃止し、最新の安定版モデルへ更新
    const API_MODEL = "gemini-3.6-flash";
    
    // キャンバスの基本的な描画設定（タッチ・マウス対応）
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
    canvas.addEventListener('mousemove', (e) => { if (isDrawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } });
    canvas.addEventListener('mouseup', () => { isDrawing = false; });
    canvas.addEventListener('touchstart', (e) => {
        isDrawing = true;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        ctx.beginPath();
        ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
        e.preventDefault();
    });
    canvas.addEventListener('touchmove', (e) => {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
        ctx.stroke();
        e.preventDefault();
    });
    canvas.addEventListener('touchend', () => { isDrawing = false; });

    // 【修正2】音声入力の即時エラー落ち対策（イベントハンドラの安定化）
    let recognition = null;
    function startVoiceInput() {
        const log = document.getElementById('statusLog');
        const speechBubble = document.getElementById('teacherMessage');
        
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            log.textContent = "エラー: お使いのブラウザは音声認識に対応していません。";
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            log.textContent = "音声を聞き取り中...話終わったらそのままお待ちください";
            speechBubble.textContent = "よく聞いてるよ、続けてどうぞ！";
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            log.textContent = "聞き取り成功: " + transcript;
            speechBubble.textContent = `「${transcript}」だね。一緒に考えてみよう！`;
        };

        recognition.onerror = (event) => {
            log.textContent = "音声認識ステータス: " + event.error + " - もう一度マイクボタンを押してね。";
            speechBubble.textContent = "うまく聞き取れなかったみたい。もう一度教えてもらえるかな？";
        };

        try {
            recognition.start();
        } catch (e) {
            log.textContent = "音声認識の起動に失敗しました: " + e.message;
        }
    }

    // 【修正3】手書き送信時のAPIエラー（404）を解消し、正確にAPIリクエストを投げる処理
    async function sendHandwriting() {
        const imageData = canvas.toDataURL('image/png');
        const log = document.getElementById('statusLog');
        const speechBubble = document.getElementById('teacherMessage');
        
        log.textContent = "手書きデータを送信中...";

        try {
            // ※必要に応じてAPIキーをご自身の環境に合わせて設定してください
            const API_KEY = "YOUR_API_KEY"; 

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${API_MODEL}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "小4の算数コーチとして、この手書きの計算・メモを読み取って、カズ先生の口調で分かりやすく解説してください。" },
                            { inline_data: { mime_type: "image/png", data: imageData.split(',')[1] } }
                        ]
                    }]
                })
            });
            
            if (!response.ok) {
                const errJson = await response.json();
                throw new Error(`API Error (${response.status}): ${errJson.error?.message || response.statusText}`);
            }
            
            const data = await response.json();
            const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || "うまく読み取れなかったみたい。もう一度書いてみてね！";

            log.textContent = "送信成功：カズ先生が解答を分析しました。";
            speechBubble.textContent = replyText;

        } catch (error) {
            log.textContent = `通信エラーが発生しました: ${error.message}\n※モデル名やAPI設定を確認してください。`;
            speechBubble.textContent = "おっと、通信の途中でトラブルみたい。もう一度送ってみてね！";
        }
    }
</script>

</body>
</html>
