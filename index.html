<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI学習コーチ - カズ先生 (v7.2 エラー完全修正＆ボタン整理)</title>
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <style>
        :root {
            --splat-yellow: #E6FF00;
            --splat-purple: #6E00FF;
            --splat-cyan: #00F0FF;
            --splat-pink: #FF007F;
            --splat-bg: #111420;
            --splat-card: #1E2235;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Arial Black', sans-serif; background: var(--splat-bg);
            overflow: hidden; display: flex; flex-direction: column; color: #FFF;
            user-select: none;
        }
        #config-bar {
            background: var(--splat-purple); color: #fff; padding: 4px 10px;
            display: flex; gap: 8px; align-items: center; font-size: 11px;
            border-bottom: 2px solid var(--splat-yellow);
        }
        #config-bar input {
            flex: 1; padding: 3px 6px; border-radius: 4px; border: none;
            font-size: 11px; background: #2A1F45; color: #FFF;
        }
        header {
            height: 48px; background: var(--splat-card);
            border-bottom: 3px solid var(--splat-yellow);
            display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
        }
        #avatar-box { display: flex; align-items: center; gap: 8px; }
        .character-title { display: flex; flex-direction: column; }
        .character-name { font-weight: 900; font-size: 14px; color: var(--splat-yellow); text-shadow: 1px 1px 0px #000; }
        .character-sub { font-size: 10px; color: #A0A5C0; }
        .header-btns { display: flex; gap: 6px; align-items: center; }
        .btn-tab {
            background: var(--splat-purple); color: #FFF; border: 1.5px solid var(--splat-yellow);
            padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;
        }
        main {
            flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px;
            overflow: hidden; position: relative;
        }
        
        #user-comment-frame {
            background: #1A1F30; border: 2px solid var(--splat-cyan);
            border-radius: 12px; padding: 6px 10px; display: none; align-items: center; gap: 8px;
            box-shadow: 0 2px 8px rgba(0,240,255,0.2);
        }
        .user-comment-label { font-size: 11px; color: var(--splat-cyan); font-weight: bold; white-space: nowrap; }
        .user-comment-text { font-size: 13px; color: #FFF; word-break: break-all; }

        #board-container {
            flex: 1; background: var(--splat-card); border-radius: 16px;
            border: 4px solid var(--splat-yellow); box-shadow: 0 4px 16px rgba(110,0,255,0.3);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .board-header {
            padding: 6px 12px; background: rgba(0,0,0,0.3); font-size: 11px;
            color: #A0A5C0; font-weight: bold; border-bottom: 2px solid #2A1F45;
            display: flex; justify-content: space-between; align-items: center;
        }
        #board-content {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 12px; text-align: center; gap: 8px; position: relative;
            overflow-y: auto;
        }
        
        #preview-container { display: none; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
        #preview-img { max-height: 70px; border-radius: 6px; border: 2px solid var(--splat-yellow); }

        .board-text-title { font-size: 16px; font-weight: 900; color: var(--splat-yellow); text-shadow: 1px 1px 0px #000; }
        .board-text-body { 
            font-size: 18px; color: #FFF; line-height: 1.5; 
            text-align: left; width: 94%; max-width: 550px; 
            padding: 12px; box-sizing: border-box; 
            background: rgba(0,0,0,0.2); border-radius: 12px; border: 2px solid rgba(255,255,255,0.1);
            font-weight: bold;
        }
        
        /* ボード内下部に常駐させる伴走アクションコントロールバー（ここで3つのボタンを完結） */
        #coaching-control-bar {
            display: none; padding: 8px; background: rgba(0,0,0,0.6);
            border-top: 2px solid var(--splat-yellow); gap: 8px; justify-content: center; flex-wrap: wrap;
            z-index: 10;
        }
        .btn-coach {
            border: none; border-radius: 12px; font-weight: 900; font-size: 12px; cursor: pointer;
            padding: 10px 14px; box-shadow: 0 2px 0 rgba(0,0,0,0.3);
        }
        #btn-easier { background: var(--splat-cyan); color: #111420; }
        #btn-next-step { background: var(--splat-yellow); color: #111420; }
        #btn-solved { background: var(--splat-pink); color: #FFF; }

        /* 通常のスタート用アクションバー（「わかった！」を削除し、質問とカメラだけに整理） */
        .action-bar { padding: 4px; display: flex; gap: 12px; justify-content: center; }
        .btn-action {
            border: none; border-radius: 20px; font-weight: 900; font-size: 13px; cursor: pointer;
            padding: 12px 20px; color: #111420; display: flex; align-items: center; gap: 4px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        #btn-q { background: var(--splat-yellow); }
        #btn-cam { background: var(--splat-cyan); }
        
        /* モーダル共通 */
        .modal-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        }
        #camera-video { width: 90%; max-width: 400px; max-height: 60vh; border-radius: 12px; border: 2px solid var(--splat-yellow); object-fit: cover; }
        
        .modal-box { width: 90%; max-width: 420px; background: var(--splat-card); border: 2px solid var(--splat-yellow); border-radius: 12px; padding: 16px; max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; text-align: center; }
        .history-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .history-item:hover { background: rgba(110,0,255,0.3); }
    </style>
</head>
<body>

    <div id="config-bar">
        <span>API Key:</span>
        <input type="password" id="api-key-input" placeholder="Gemini APIキーを入力">
    </div>

    <header>
        <div id="avatar-box">
            <svg width="36" height="36" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#6E00FF" stroke="#E6FF00" stroke-width="6"/>
                <circle cx="35" cy="40" r="7" fill="#E6FF00"/>
                <circle cx="65" cy="40" r="7" fill="#E6FF00"/>
                <path d="M 35 65 Q 50 75 65 65" stroke="#E6FF00" stroke-width="5" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="character-title">
                <span class="character-name">カズ先生のホワイトボード</span>
                <span class="character-sub">小4 算数コーチング (v7.2)</span>
            </div>
        </div>
        <div class="header-btns">
            <button class="btn-tab" id="btn-new-session">＋ 新しい相談</button>
            <button class="btn-tab" id="btn-history-list">📖 相談履歴</button>
        </div>
    </header>

    <main>
        <div id="user-comment-frame">
            <span class="user-comment-label">🗣️ あなた:</span>
            <span class="user-comment-text" id="user-comment-text"></span>
        </div>

        <div id="board-container">
            <div class="board-header">
                <span id="board-status">【ステータス：伴走待機中】</span>
                <span id="session-title-badge">テーマ: 新規相談</span>
            </div>
            
            <div id="board-content">
                <div id="preview-container">
                    <img id="preview-img" alt="プレビュー">
                </div>
                
                <div class="board-text-title" id="board-title">カズ先生からのメッセージ</div>
                <div class="board-text-body" id="board-speech">
                    こんにちは！解きたい問題を「カメラ」で写すか、<br>
                    「質問する」ボタンでおしえてね！最後まで一緒に伴走するよ。
                </div>
            </div>
            
            <!-- 先生が答えた後にホワイトボード下部に現れる伴走アクションボタン群 -->
            <div id="coaching-control-bar">
                <button class="btn-coach" id="btn-easier">💡 もっとわかりやすく</button>
                <button class="btn-coach" id="btn-next-step">➡️ つぎへ進む</button>
                <button class="btn-coach" id="btn-solved">👍 わかった！</button>
            </div>

            <!-- カメラモーダル -->
            <div id="camera-modal" class="modal-overlay">
                <video id="camera-video" autoplay playsinline muted></video>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-action" id="snap-btn" style="background: var(--splat-yellow);">しゃしんをとる</button>
                    <button class="btn-action" id="close-cam-btn" style="background: #A0A5C0;">やめる</button>
                </div>
            </div>

            <!-- 履歴一覧モーダル -->
            <div id="history-modal" class="modal-overlay">
                <div class="modal-box" style="text-align: left;">
                    <div style="font-weight:900; color:var(--splat-yellow); font-size:16px; margin-bottom:4px;">これまでの相談ルーム</div>
                    <div id="history-list-container" style="display:flex; flex-direction:column; gap:8px;"></div>
                    <button class="btn-action" id="close-history-btn" style="background: #A0A5C0; width:100%; justify-content:center; margin-top:8px;">とじる</button>
                </div>
            </div>

            <!-- 「わかった！」の選択肢モーダル -->
            <div id="solved-modal" class="modal-overlay">
                <div class="modal-box">
                    <div style="font-weight:900; color:var(--splat-yellow); font-size:16px;">よくがんばったね！🎉</div>
                    <div style="font-size:13px; color:#FFF; line-height:1.5;">この相談をどうする？</div>
                    <button class="btn-coach" id="btn-end-session" style="background: var(--splat-pink); color:#FFF; width:100%;">🏁 相談を終了して履歴に保存する</button>
                    <button class="btn-coach" id="btn-continue-session" style="background: var(--splat-yellow); color:#111420; width:100%;">✏️ 引き続きこの相談を続ける</button>
                </div>
            </div>
        </div>

        <!-- 下部のメインアクションバー（質問とカメラのみに整理） -->
        <div class="action-bar" id="main-action-bar">
            <button class="btn-action" id="btn-q">🎙️ 質問する</button>
            <button class="btn-action" id="btn-cam">📷 カメラ</button>
        </div>
    </main>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        console.log("Kazu-sensei Board v7.2 loaded.");

        const apiKeyInput = document.getElementById('api-key-input');
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        });

        const boardSpeech = document.getElementById('board-speech');
        const boardTitle = document.getElementById('board-title');
        const boardStatus = document.getElementById('board-status');
        const sessionTitleBadge = document.getElementById('session-title-badge');
        const userCommentFrame = document.getElementById('user-comment-frame');
        const userCommentText = document.getElementById('user-comment-text');
        
        const btnCam = document.getElementById('btn-cam');
        const cameraModal = document.getElementById('camera-modal');
        const cameraVideo = document.getElementById('camera-video');
        const snapBtn = document.getElementById('snap-btn');
        const closeCamBtn = document.getElementById('close-cam-btn');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');

        const historyModal = document.getElementById('history-modal');
        const historyListContainer = document.getElementById('history-list-container');
        const btnHistoryList = document.getElementById('btn-history-list');
        const closeHistoryBtn = document.getElementById('close-history-btn');
        const btnNewSession = document.getElementById('btn-new-session');

        const solvedModal = document.getElementById('solved-modal');
        const btnEndSession = document.getElementById('btn-end-session');
        const btnContinueSession = document.getElementById('btn-continue-session');
        const coachingControlBar = document.getElementById('coaching-control-bar');

        let currentSessionId = 'session_' + Date.now();
        let currentSessionTitle = '新規の相談';
        let chatHistory = []; 
        let mediaStream = null;

        function saveCurrentSession() {
            if (chatHistory.length === 0) return;
            const sessions = JSON.parse(localStorage.getItem('kazu_sessions') || '{}');
            sessions[currentSessionId] = {
                title: currentSessionTitle,
                updatedAt: new Date().toLocaleString(),
                history: chatHistory,
                lastSpeech: boardSpeech.innerHTML
            };
            localStorage.setItem('kazu_sessions', JSON.stringify(sessions));
        }

        function loadSessionList() {
            historyListContainer.innerHTML = '';
            const sessions = JSON.parse(localStorage.getItem('kazu_sessions') || '{}');
            const keys = Object.keys(sessions);
            
            if (keys.length === 0) {
                historyListContainer.innerHTML = '<div style="font-size:12px; color:#A0A5C0; text-align:center; padding:10px;">まだ保存された相談はありません</div>';
                return;
            }

            keys.reverse().forEach(key => {
                const s = sessions[key];
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<div><div style="font-weight:bold; font-size:13px; color:#FFF;">${s.title}</div><div style="font-size:10px; color:#A0A5C0;">${s.updatedAt}</div></div><span style="font-size:12px; color:var(--splat-yellow);">つづきへ ➔</span>`;
                div.onclick = () => {
                    currentSessionId = key;
                    currentSessionTitle = s.title;
                    chatHistory = s.history || [];
                    sessionTitleBadge.innerText = `テーマ: ${currentSessionTitle}`;
                    boardSpeech.innerHTML = s.lastSpeech || "前の続きから再開するよ！";
                    speakText(boardSpeech.innerText);
                    historyModal.style.display = 'none';
                    coachingControlBar.style.display = 'flex';
                    updateBoard("伴走中（履歴から再開）", "カズ先生のホワイトボード解説");
                };
                historyListContainer.appendChild(div);
            });
        }

        btnNewSession.addEventListener('click', () => {
            saveCurrentSession();
            currentSessionId = 'session_' + Date.now();
            currentSessionTitle = '新規の相談';
            chatHistory = [];
            sessionTitleBadge.innerText = `テーマ: 新規の相談`;
            previewContainer.style.display = 'none';
            userCommentFrame.style.display = 'none';
            coachingControlBar.style.display = 'none';
            boardTitle.style.display = 'block';
            updateBoard("新規ルーム", "カズ先生からのメッセージ", "新しい相談ルームだよ！解きたい問題を教えてね。");
        });

        btnHistoryList.addEventListener('click', () => {
            loadSessionList();
            historyModal.style.display = 'flex';
        });

        closeHistoryBtn.addEventListener('click', () => {
            historyModal.style.display = 'none';
        });

        function updateBoard(statusText, titleText, speechText = null, userText = null) {
            boardStatus.innerText = `【ステータス：${statusText}】`;
            if (titleText) boardTitle.innerText = titleText;
            
            if (userText) {
                userCommentFrame.style.display = 'flex';
                userCommentText.innerText = userText;
            } else {
                userCommentFrame.style.display = 'none';
            }

            if (speechText) {
                boardSpeech.innerHTML = speechText;
                speakText(speechText);
                coachingControlBar.style.display = 'flex'; // 先生が答えたら操作バーを出現させる
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            const cleanText = text.replace(/<[^>]*>?/gm, '');
            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = 'ja-JP';
            utter.rate = 1.05; 
            utter.pitch = 1.0;
            
            setTimeout(() => {
                window.speechSynthesis.speak(utter);
            }, 100);
        }

        async function askGemini(userInputText, base64Image = null, userDisplayText = null) {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                updateBoard("エラー", "APIキー未入力", "上の欄に Gemini APIキー を入力してね！", userDisplayText);
                return;
            }

            try {
                updateBoard("伴走・思考中...", "カズ先生が考えています...", null, userDisplayText);
                
                const ai = new GoogleGenAI({ apiKey: apiKey });

                const systemInstruction = `あなたは小学4年生の算数専用の、粘り強く寄り添う熱血でやさしい指導者「カズ先生」です。
コーチングのルール：
1. **答えや計算結果を直接教えないこと**。
2. 子供が自分の足で答えにたどり着くまで何段階にも分けて伴走する。
3. ホワイトボードに書くように、大きな文字でわかりやすく3行程度でまとめる。
4. 会話の文脈を維持する。`;

                // 完全に安全なパーツ構成（データエラーを完全に防止）
                let currentParts = [];
                if (base64Image) {
                    const base64Data = base64Image.split(',')[1];
                    currentParts.push({
                        inlineData: { mimeType: "image/jpeg", data: base64Data }
                    });
                }
                if (userInputText) {
                    currentParts.push(userInputText);
                }

                chatHistory.push({ role: 'user', parts: currentParts });

                if (currentSessionTitle === '新規の相談' && userInputText && !base64Image) {
                    currentSessionTitle = userInputText.slice(0, 15) + (userInputText.length > 15 ? '...' : '');
                    sessionTitleBadge.innerText = `テーマ: ${currentSessionTitle}`;
                } else if (currentSessionTitle === '新規の相談' && base64Image) {
                    currentSessionTitle = '算数の問題の相談';
                    sessionTitleBadge.innerText = `テーマ: ${currentSessionTitle}`;
                }

                const response = await ai.models.generateContent({
                    model: 'gemini-3.6-flash',
                    contents: chatHistory,
                    config: {
                        systemInstruction: systemInstruction,
                    }
                });

                if (response && response.text) {
                    const replyText = response.text.replace(/\n/g, '<br>');
                    chatHistory.push({ role: 'model', parts: [{ text: response.text }] });
                    
                    updateBoard("伴走コーチング中", "カズ先生のホワイトボード解説", replyText, userDisplayText);
                    saveCurrentSession();
                } else {
                    updateBoard("エラー", "データなし", "ホワイトボードに文字を書けませんでした。", userDisplayText);
                }
            } catch (err) {
                console.error("SDK Error:", err);
                updateBoard("エラー発生", "通信エラー", `詳細: ${err.message}`, userDisplayText);
            }
        }

        btnCam.addEventListener('click', async () => {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert('お使いのブラウザはカメラに対応していません。');
                    return;
                }
                updateBoard("カメラ起動中", "問題の読み取り", "ノートをカメラにうつしてね！");
                cameraModal.style.display = 'flex';
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                cameraVideo.srcObject = mediaStream;
            } catch (err) {
                alert('カメラをひらけませんでした: ' + err.message);
                cameraModal.style.display = 'none';
                updateBoard("待機中", "カズ先生からのメッセージ", "カメラが開けなかったよ。");
            }
        });

        snapBtn.addEventListener('click', () => {
            const canvas = document.getElementById('capture-canvas');
            canvas.width = cameraVideo.videoWidth || 640;
            canvas.height = cameraVideo.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
            
            const capturedBase64 = canvas.toDataURL('image/jpeg');
            previewImg.src = capturedBase64;
            
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            cameraModal.style.display = 'none';

            boardTitle.style.display = 'block';
            previewContainer.style.display = 'flex';
            
            askGemini("このノートの問題を見て、答えを言わずに、最初のヒントをホワイトボードに分かりやすく教えてください。", capturedBase64, "カメラで問題を撮影して相談しました");
        });

        closeCamBtn.addEventListener('click', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            cameraModal.style.display = 'none';
            updateBoard("待機中", "カズ先生からのメッセージ", "カメラを閉じました。");
        });

        document.getElementById('btn-q').addEventListener('click', () => {
            previewContainer.style.display = 'none';
            boardTitle.style.display = 'block';
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.interimResults = false;

                recognition.onstart = () => {
                    updateBoard("音声聞き取り中", "質問を受け付けています", "マイクに向かって話してね……");
                };

                recognition.onresult = (event) => {
                    const speechResult = event.results[0][0].transcript;
                    askGemini(`生徒からの発言・質問: ${speechResult}`, null, speechResult);
                };

                recognition.onerror = () => {
                    updateBoard("聞き取り失敗", "もう一度お試しください", "うまく聞き取れなかったよ。もう一度マイクボタンを押して話してね！");
                };

                recognition.start();
            } else {
                updateBoard("テキスト入力モード", "質問受付", "音声認識が使えない環境のため、テキストで質問してください。");
                askGemini("小4の算数について質問があります。答えを言わずにヒントを教えてください。", null, "テキストで質問しました");
            }
        });

        // 3つの伴走アクションボタンの挙動
        document.getElementById('btn-easier').addEventListener('click', () => {
            askGemini("今のヒントがちょっと難しかったよ。もっと身近な例え話や、別の噛み砕いた解説を教えて！", null, "もっとわかりやすく教えて！");
        });

        document.getElementById('btn-next-step').addEventListener('click', () => {
            askGemini("今の内容はわかったよ！次のステップに進むためのヒントを教えて。", null, "つぎへ進む");
        });

        document.getElementById('btn-solved').addEventListener('click', () => {
            solvedModal.style.display = 'flex';
        });

        btnEndSession.addEventListener('click', () => {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            solvedModal.style.display = 'none';
            previewContainer.style.display = 'none';
            boardTitle.style.display = 'block';
            
            const cheers = "すごい！今回の相談はこれにてクリア！しっかり相談履歴に保存したよ。次の問題もがんばろう！";
            updateBoard("完了・保存済", "カズ先生からのメッセージ", cheers, "わかった！相談を終了して保存するよ");
            
            chatHistory.push({ role: 'user', parts: [{ text: "わかった！" }] });
            chatHistory.push({ role: 'model', parts: [{ text: cheers }] });
            saveCurrentSession();
            
            coachingControlBar.style.display = 'none';
            currentSessionId = 'session_' + Date.now();
            currentSessionTitle = '新規の相談';
            chatHistory = [];
            sessionTitleBadge.innerText = `テーマ: 新規の相談`;
        });

        btnContinueSession.addEventListener('click', () => {
            solvedModal.style.display = 'none';
            updateBoard("伴走継続中", "カズ先生のホワイトボード解説", "よし、この調子でどんどん質問してね！次の疑問は何かな？", "引き続きこの相談を続ける");
        });
    </script>
</body>
</html>
