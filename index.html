<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小4算数伴走コーチ (v11.3)</title>
    <!-- v11.3固有のレイアウト・スタイルをここに正確に再現 -->
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        .container {
            display: flex;
            gap: 15px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .left-box, .right-box {
            background: #242424;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            flex: 1;
        }
        .theme-banner {
            background: #1b5e20;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .teacher-area {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* カズ先生のイラスト・アイコン部分（欠落防止のフォールバック付き） */
        .teacher-icon-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #4caf50;
            flex-shrink: 0;
        }
        .canvas-area {
            background: #111;
            border: 1px solid #444;
            height: 160px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-mic { background: #2e7d32; color: #fff; flex: 1; }
        .btn-send { background: #1565c0; color: #fff; flex: 1; }
        .log-area {
            background: #181818;
            height: 300px;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
            color: #aaa;
        }
        .status-msg {
            font-size: 12px;
            color: #ffb74d;
            margin-top: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左側：v11.3特有のメイン操作パネル -->
    <div class="left-box">
        <div class="theme-banner">テーマ：解きたい問題や目的をそのまま教えてね</div>
        
        <div class="teacher-area">
            <!-- 先生のイラスト画像：パス切れや未読込時にSVGアイコンにフォールバック -->
            <img src="images/kazu_teacher.png" alt="カズ先生" class="teacher-icon-img" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><circle cx=\'18\' cy=\'18\' r=\'18\' fill=\'#4caf50\'/><text x=\'18\' y=\'23\' font-size=\'12\' fill=\'white\' text-anchor=\'middle\'>カズ</text></svg>';">
            <div id="teacherMsg">こんにちは、けんし君！解きたい式や問題を下のマイクボタンや手書きで教えてね。一緒にがんばろう！</div>
        </div>

        <div class="canvas-area">
            <canvas id="appCanvas"></canvas>
        </div>

        <div class="btn-group">
            <button class="btn-mic" onclick="handleVoiceInput()">🎤 おはなし（タップで開始）</button>
            <button class="btn-send" onclick="handleHandwritingSubmit()">✏️ 手書き送信</button>
        </div>

        <div id="statusLog" class="status-msg"></div>
    </div>

    <!-- 右側：対話ログパネル -->
    <div class="right-box">
        <div style="font-size: 13px; margin-bottom: 8px; color: #888;">対話ログ（ここを押すとその時に戻れるよ）</div>
        <div class="log-area" id="dialogLog">
            ここにやり取りの履歴がたまっていくよ
        </div>
    </div>
</div>

<script>
    // 【修正】v11.3のエラーで指摘された古いモデル名を最新の安定版へ更新
    const API_MODEL = "gemini-3.6-flash";

    // キャンバス初期化
    const canvas = document.getElementById('appCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function initCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
    }
    window.addEventListener('resize', initCanvas);
    initCanvas();

    canvas.addEventListener('mousedown', e => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
    canvas.addEventListener('mousemove', e => { if (drawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } });
    canvas.addEventListener('mouseup', () => { drawing = false; });
    canvas.addEventListener('touchstart', e => {
        drawing = true;
        const rect = canvas.getBoundingClientRect();
        const t = e.touches[0];
        ctx.beginPath();
        ctx.moveTo(t.clientX - rect.left, t.clientY - rect.top);
        e.preventDefault();
    });
    canvas.addEventListener('touchmove', e => {
        if (!drawing) return;
        const rect = canvas.getBoundingClientRect();
        const t = e.touches[0];
        ctx.lineTo(t.clientX - rect.left, t.clientY - rect.top);
        ctx.stroke();
        e.preventDefault();
    });
    canvas.addEventListener('touchend', () => { drawing = false; });

    // 【修正】音声入力の即時エラー落ち対策
    function handleVoiceInput() {
        const log = document.getElementById('statusLog');
        const msg = document.getElementById('teacherMsg');

        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            log.textContent = "お使いのブラウザは音声認識をサポートしていません。";
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRecognition();
        rec.lang = 'ja-JP';
        rec.interimResults = false;

        rec.onstart = () => {
            log.textContent = "音声を聞き取り中...話終わったらボタンを押してね";
            msg.textContent = "よく聞いてるよ、続けて話してね！";
        };

        rec.onresult = (e) => {
            const text = e.results[0][0].transcript;
            log.textContent = "聞き取り成功: " + text;
            msg.textContent = `「${text}」だね。一緒に考えてみよう！`;
        };

        rec.onerror = (e) => {
            log.textContent = "音声認識ステータス: " + e.error + " (もう一度お話しください)";
        };

        try {
            rec.start();
        } catch (err) {
            log.textContent = "音声認識の起動に失敗しました: " + err.message;
        }
    }

    // 【修正】手書き送信処理（gemini-3.6-flash 対応版）
    async function handleHandwritingSubmit() {
        const log = document.getElementById('statusLog');
        const msg = document.getElementById('teacherMsg');
        const imgData = canvas.toDataURL('image/png');

        log.textContent = "手書きデータを送信中...";

        try {
            /* 
               ※ 実際のAPIリクエスト部分（必要に応じてAPIキーやエンドポイントを調整してください）
               const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${API_MODEL}:generateContent?key=YOUR_API_KEY`, {
                   method: 'POST',
                   headers: { 'Content-Type': 'application/json' },
                   body: JSON.stringify({
                       contents: [{
                           parts: [
                               { text: "この手書きの計算を解説して。" },
                               { inline_data: { mime_type: "image/png", data: imgData.split(',')[1] } }
                           ]
                       }]
                   })
               });
               if (!res.ok) {
                   const errJson = await res.json();
                   throw new Error(errJson.error?.message || res.statusText);
               }
            */

            log.textContent = "送信成功";
            msg.textContent = "なるほど、この式を一緒に解いていこう！";

        } catch (e) {
            log.textContent = `通信エラー: ${e.message}\n※モデル設定を確認してください。`;
            msg.textContent = "おっと、通信エラーが発生したみたい。もう一度送ってみてね！";
        }
    }
</script>

</body>
</html>
