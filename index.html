<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI学習コーチ - カズ先生 (v11.0)</title>

    <style>
        :root {
            --splat-yellow: #CCFF00;
            --splat-purple: #7B00FF;
            --splat-cyan: #00F0FF;
            --splat-pink: #FF0055;
            --splat-bg: #0B0E14;
            --splat-card: #171B2C;
            --splat-border: #2B314F;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--splat-bg);
            overflow: hidden; display: flex; flex-direction: column; color: #FFF;
            user-select: none;
        }
        /* スプラ風の背景パターンをぼんやり配置 */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(123,0,255,0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0,240,255,0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(204,255,0,0.06) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }

        #config-bar {
            position: relative; z-index: 10;
            background: var(--splat-purple); color: #fff; padding: 4px 12px;
            display: flex; gap: 8px; align-items: center; font-size: 11px;
            border-bottom: 3px solid var(--splat-yellow); flex-shrink: 0;
        }
        #config-bar input {
            flex: 1; padding: 4px 8px; border-radius: 6px; border: none;
            font-size: 11px; background: #1E1235; color: #FFF; font-weight: bold;
        }
        header {
            position: relative; z-index: 10;
            height: 52px; background: var(--splat-card); flex-shrink: 0;
            border-bottom: 4px solid var(--splat-yellow);
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
        }
        #avatar-box { display: flex; align-items: center; gap: 12px; }
        .character-title { display: flex; flex-direction: column; }
        .character-name { font-weight: 900; font-size: 15px; color: var(--splat-yellow); text-shadow: 2px 2px 0px #000; letter-spacing: 0.5px; }
        .character-sub { font-size: 11px; color: #8F94B2; font-weight: bold; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .btn-tab {
            background: var(--splat-purple); color: #FFF; border: 2px solid var(--splat-yellow);
            padding: 6px 14px; border-radius: 10px; font-size: 12px; font-weight: 900; cursor: pointer;
            box-shadow: 0 3px 0 #000; transition: transform 0.1s;
        }
        .btn-tab:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }

        /* 全体レイアウト */
        main {
            position: relative; z-index: 10;
            flex: 1; display: flex; gap: 10px; padding: 10px;
            overflow: hidden; max-width: 1400px; width: 100%; margin: 0 auto; box-sizing: border-box;
        }

        #left-pane {
            flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; height: 100%;
        }
        
        #board-container {
            flex: 1; background: var(--splat-card); border-radius: 18px;
            border: 4px solid var(--splat-yellow); box-shadow: 0 8px 24px rgba(123,0,255,0.4);
            display: flex; flex-direction: column; position: relative; overflow: hidden; min-height: 0;
        }
        .board-header {
            padding: 6px 14px; background: rgba(0,0,0,0.5); font-size: 12px; flex-shrink: 0;
            color: #8F94B2; font-weight: 900; border-bottom: 2px solid var(--splat-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        /* 今の相談テーマボックス：さらに大きめ＆目立つデザインに改良 */
        #current-topic-banner {
            background: linear-gradient(90deg, #241147, #3B1C6C);
            border-bottom: 3px solid var(--splat-cyan);
            padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }
        #current-topic-label {
            font-size: 11px; background: var(--splat-cyan); color: #0B0E14; font-weight: 900; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.5px; flex-shrink: 0;
        }
        #current-topic-text {
            font-size: 15px; font-weight: 900; color: #CCFF00; text-shadow: 1px 1px 0 #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        #board-content {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; padding: 12px; text-align: center; gap: 10px; position: relative;
            overflow-y: auto; min-height: 0;
        }
        
        .manga-stage {
            display: flex; gap: 14px; align-items: center; width: 96%; flex-shrink: 0;
            background: rgba(0,0,0,0.4); border: 2px solid var(--splat-purple); border-radius: 14px; padding: 10px 16px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
        }
        #teacher-avatar-svg { width: 76px; height: 76px; flex-shrink: 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7)); }
        
        #visual-container {
            display: none; width: 96%; background: #0D101A; flex-shrink: 0;
            border: 2px solid var(--splat-cyan); border-radius: 12px; padding: 10px; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }
        #visual-svg { width: 100%; height: 110px; }

        #preview-container { display: none; flex-direction: column; align-items: center; gap: 4px; width: 100%; flex-shrink: 0; }
        #preview-img { max-height: 60px; border-radius: 6px; border: 2px solid var(--splat-yellow); }

        .board-text-title { font-size: 13px; font-weight: 900; color: var(--splat-cyan); text-shadow: 1px 1px 0px #000; align-self: flex-start; margin-left: 2%; display: flex; align-items: center; gap: 6px; flex-shrink: 0;}
        
        .board-text-body { 
            font-size: 16px; color: #FFF; line-height: 1.65; 
            text-align: left; width: 96%; 
            padding: 14px 18px; box-sizing: border-box; 
            background: #111522; border-radius: 14px; border: 2px solid var(--splat-border);
            font-weight: bold; flex-shrink: 0;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
            letter-spacing: 0.5px;
        }
        .board-text-body .highlight-word {
            color: var(--splat-yellow);
            font-size: 18px;
            font-weight: 900;
            text-shadow: 1px 1px 0px #000;
            background: rgba(204,255,0,0.12);
            padding: 0 4px;
            border-radius: 4px;
        }

        #right-pane {
            flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 320px; height: 100%;
        }

        #timeline-card-wrapper {
            flex: 1; background: var(--splat-card); border: 3px solid var(--splat-border);
            border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; min-height: 0;
        }
        .pane-header {
            background: rgba(0,0,0,0.3); padding: 8px 12px; font-size: 11px; color: var(--splat-cyan);
            font-weight: 900; border-bottom: 2px solid var(--splat-border); display: flex; justify-content: space-between; align-items: center;
        }
        #timeline-container {
            flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px;
        }
        .timeline-item {
            background: #121726; border: 1px solid var(--splat-border); border-radius: 8px; padding: 6px 10px;
            cursor: pointer; transition: all 0.2s; text-align: left;
        }
        .timeline-item:hover { border-color: var(--splat-yellow); background: #1A2138; }
        .timeline-item.active { border-color: var(--splat-cyan); background: rgba(0,240,255,0.05); }
        .tl-user { font-size: 10px; color: var(--splat-cyan); font-weight: 900; margin-bottom: 2px; }
        .tl-content { font-size: 11px; color: #D1D5DB; font-weight: bold; line-height: 1.3; }

        #handwriting-card {
            flex: 2; background: var(--splat-card); border: 3px solid var(--splat-yellow);
            border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; min-height: 0;
        }
        #draw-canvas {
            flex: 1; background: #0D101A; cursor: crosshair; touch-action: none; width: 100%; display: block;
        }
