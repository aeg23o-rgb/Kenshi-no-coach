<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI学習コーチ - カズくん (v4.0 安定版)</title>
    <style>
        :root {
            --splat-yellow: #E6FF00;
            --splat-purple: #6E00FF;
            --splat-pink: #FF007F;
            --splat-bg: #111420;
            --splat-card: #1E2235;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Arial Black', sans-serif; background: var(--splat-bg);
            overflow: hidden; display: flex; flex-direction: column; color: #FFF;
            user-select: none;
        }
        #config-bar {
            background: var(--splat-purple); color: #fff; padding: 6px 12px;
            display: flex; gap: 8px; align-items: center; font-size: 12px;
            border-bottom: 2px solid var(--splat-yellow);
        }
        #config-bar input {
            flex: 1; padding: 4px 8px; border-radius: 6px; border: none;
            font-size: 12px; background: #2A1F45; color: #FFF;
        }
        header {
            height: 52px; background: var(--splat-card);
            border-bottom: 3px solid var(--splat-yellow);
            display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
        }
        #avatar-box { display: flex; align-items: center; gap: 10px; }
        .character-title { display: flex; flex-direction: column; }
        .character-name { font-weight: 900; font-size: 15px; color: var(--splat-yellow); text-shadow: 1px 1px 0px #000; }
        .character-sub { font-size: 10px; color: #A0A5C0; }
        .header-btns { display: flex; gap: 6px; align-items: center; }
        .btn-report {
            background: var(--splat-purple); color: #FFF; border: 1.5px solid var(--splat-yellow);
            padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;
        }
        main {
            flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px;
            overflow: hidden; position: relative;
        }
        #board-container {
            flex: 1; background: var(--splat-card); border-radius: 16px;
            border: 3px solid var(--splat-yellow); box-shadow: 0 4px 16px rgba(110,0,255,0.25);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .board-header {
            padding: 8px 14px; background: rgba(0,0,0,0.4); font-size: 11px;
            color: #A0A5C0; font-weight: bold; border-bottom: 2px solid #2A1F45;
            display: flex; justify-content: space-between; align-items: center;
        }
        #board-content {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 16px; text-align: center; gap: 12px; position: relative;
            overflow-y: auto;
        }
        .math-display { font-size: 18px; font-weight: 900; color: var(--splat-yellow); text-shadow: 2px 2px 0px #000; letter-spacing: 1px; }
        .math-subtext { font-size: 13px; color: #FFF; line-height: 1.5; background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 12px; border: 4px solid var(--splat-yellow); width: 90%; max-width: 500px; box-sizing: border-box; text-align: left; word-break: break-all; }
        
        #preview-container { display: none; flex-direction: column; align-items: center; gap: 6px; width: 100%; margin-bottom: 4px; }
        #preview-img { max-height: 100px; border-radius: 6px; border: 2px solid var(--splat-yellow); }

        .action-bar { padding: 0 10px 10px; display: flex; gap: 8px; justify-content: center; }
        .btn-action {
            border: none; border-radius: 24px; font-weight: 900; font-size: 14px; cursor: pointer;
            padding: 12px 20px; color: #111420; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        #btn-q { background: var(--splat-yellow); }
        #btn-cam { background: #00F0FF; }
        #btn-ok { background: var(--splat-pink); color: #FFF; }
        
        #camera-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        }
        #camera-video { width: 90%; max-width: 400px; max-height: 60vh; border-radius: 12px; border: 2px solid var(--splat-yellow); object-fit: cover; }
    </style>
</head>
<body>

    <div id="config-bar">
        <span>Gemini API Key:</span>
        <input type="password" id="api-key-input" placeholder="APIキーを入力してね">
    </div>

    <header>
        <div id="avatar-box">
            <svg width="44" height="44" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#6E00FF" stroke="#E6FF00" stroke-width="8"/>
                <circle cx="35" cy="40" r="8" fill="#E6FF00"/>
                <circle cx="65" cy="40" r="8" fill="#E6FF00"/>
                <path d="M 35 65 Q 50 80 65 65" stroke="#E6FF00" stroke-width="6" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="character-title">
                <span class="character-name">算数コーチ カズくん</span>
                <span class="character-sub">小4 算数専用パートナー</span>
            </div>
        </div>
        <div class="header-btns">
            <button class="btn-report" id="btn-log">v4.0</button>
        </div>
    </header>

    <main>
        <div id="board-container">
            <div class="board-header">
                <span>COACH BOARD (解説・図解エリア)</span>
                <span id="status-badge" style="color: var(--splat-yellow);">待機中</span>
            </div>
            <div id="board-content">
                <div id="preview-container">
                    <img id="preview-img" alt="プレビュー">
                </div>
                <div class="math-display" id="main-title">先生からのメッセージ</div>
                <div class="math-subtext" id="coach-speech">
                    こんにちは！きみのもんだいを見せてね。<br>「カメラ」でノートをうつすか、「質問する」でおしえてね！
                </div>
            </div>
            
            <div id="camera-modal">
                <video id="camera-video" autoplay playsinline muted></video>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-action" id="snap-btn" style="background: var(--splat-yellow);">しゃしんをとる</button>
                    <button class="btn-action" id="close-cam-btn" style="background: #A0A5C0;">やめる</button>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn-action" id="btn-q">🎙️ 質問する</button>
            <button class="btn-action" id="btn-cam">📷 カメラ</button>
            <button class="btn-action" id="btn-ok">👍 わかった！</button>
        </div>
    </main>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <script>
        console.log("Kazu-kun Coach v4.0 loaded successfully.");

        const apiKeyInput = document.getElementById('api-key-input');
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        });

        const speechElem = document.getElementById('coach-speech');
        const btnCam = document.getElementById('btn-cam');
        const cameraModal = document.getElementById('camera-modal');
        const cameraVideo = document.getElementById('camera-video');
        const snapBtn = document.getElementById('snap-btn');
        const closeCamBtn = document.getElementById('close-cam-btn');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');
        const mainTitle = document.getElementById('main-title');
        const statusBadge = document.getElementById('status-badge');

        let mediaStream = null;

        function setStatus(badgeText, speechText) {
            statusBadge.innerText = badgeText;
            if (speechText) {
                speechElem.innerHTML = speechText;
                speakText(speechText);
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/<[^>]*>?/gm, '');
            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = 'ja-JP';
            utter.rate = 1.1;
            window.speechSynthesis.speak(utter);
        }

        // 利用可能なモデルを自動検出する関数
        async function getAvailableModel(apiKey) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                if (!res.ok) return 'gemini-1.5-flash'; // フォールバック
                const data = await res.json();
                if (data.models) {
                    // generateContentをサポートしている flash または pro モデルを優先的に探す
                    const validModel = data.models.find(m => 
                        m.supportedGenerationMethods && 
                        m.supportedGenerationMethods.includes('generateContent') &&
                        (m.name.includes('flash') || m.name.includes('pro'))
                    );
                    if (validModel) {
                        // "models/gemini-1.5-flash" のような形式からプレフィックスを外すかそのまま返す
                        return validModel.name.replace('models/', '');
                    }
                }
            } catch (e) {
                console.warn("Model fetch failed, using default", e);
            }
            return 'gemini-1.5-flash';
        }

        async function askGemini(promptText, base64Image = null) {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                setStatus("エラー", "上の欄に Gemini APIキー が入力されていないよ！確認してね。");
                return;
            }

            setStatus("準備中...", "使えるモデルを確認しているよ...");
            const modelName = await getAvailableModel(apiKey);
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            
            let contents = [{
                parts: [
                    { text: "あなたは小学4年生の算数専用のやさしいAIコーチ「カズくん」です。子供に寄り添い、答えを直接教えるのではなく、ヒントや考え方をわかりやすく短く（3行程度で）解説してください。\n\n" + promptText }
                ]
            }];
            
            if (base64Image) {
                const base64Data = base64Image.split(',')[1];
                contents[0].parts.push({
                    inline_data: {
                        mime_type: "image/jpeg",
                        data: base64Data
                    }
                });
            }

            try {
                setStatus("考え中...", `(${modelName}) カズくんが考えているよ...`);
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: contents })
                });

                if (!response.ok) {
                    const errData = await response.text();
                    console.error("API Error:", response.status, errData);
                    setStatus("HTTPエラー " + response.status, `詳細: ${errData.substring(0, 150)}`);
                    return;
                }

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    setStatus("解説中", aiText.replace(/\n/g, '<br>'));
                } else {
                    setStatus("データエラー", "レスポンスの形式が違います。");
                }
            } catch (err) {
                setStatus("通信例外エラー", err.message);
            }
        }

        btnCam.addEventListener('click', async () => {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert('お使いのブラウザはカメラに対応していません。');
                    return;
                }
                setStatus("カメラ起動中...", "ノートをカメラにうつしてね！");
                cameraModal.style.display = 'flex';
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                cameraVideo.srcObject = mediaStream;
            } catch (err) {
                alert('カメラをひらけませんでした: ' + err.message);
                cameraModal.style.display = 'none';
                setStatus("待機中", "カメラが開けなかったよ。");
            }
        });

        snapBtn.addEventListener('click', () => {
            const canvas = document.getElementById('capture-canvas');
            canvas.width = cameraVideo.videoWidth || 640;
            canvas.height = cameraVideo.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
            
            const capturedBase64 = canvas.toDataURL('image/jpeg');
            previewImg.src = capturedBase64;
            
            stopCamera();
            cameraModal.style.display = 'none';

            mainTitle.style.display = 'none';
            previewContainer.style.display = 'flex';
            
            askGemini("このノートに書かれている算数の問題を見て、小4の子に向けて解き方のヒントや考え方を優しく教えてください。", capturedBase64);
        });

        closeCamBtn.addEventListener('click', () => {
            stopCamera();
            cameraModal.style.display = 'none';
            setStatus("待機中", "カメラをとめたよ。");
        });

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        document.getElementById('btn-q').addEventListener('click', () => {
            previewContainer.style.display = 'none';
            mainTitle.style.display = 'block';
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.interimResults = false;

                recognition.onstart = () => {
                    setStatus("聞き取り中...", "「先生、ここがわからないよ！」ってマイクに向かって話してね……");
                };

                recognition.onresult = (event) => {
                    const speechResult = event.results[0][0].transcript;
                    askGemini(`生徒からの質問: ${speechResult}`);
                };

                recognition.onerror = () => {
                    setStatus("聞き取り失敗", "うまく聞き取れなかったから、もう一度ボタンを押して話してね！");
                };

                recognition.start();
            } else {
                setStatus("考え中...", "音声認識が使えない環境みたい。テキストで質問してね！");
                askGemini("小4の算数について質問があります。わかりやすく教えてください。");
            }
        });

        document.getElementById('btn-ok').addEventListener('click', () => {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            previewContainer.style.display = 'none';
            mainTitle.style.display = 'block';
            setStatus("待機中", "すごい！そのちょうしだね！ほかの問題もチャレンジしてみよう！");
        });
    </script>
</body>
</html>
